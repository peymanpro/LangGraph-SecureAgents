name: One-time branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/branch-cleanup-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Remove stale non-default branches
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-default unprotected branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          api_url = os.environ["GH_API_URL"].rstrip("/")
          repository = os.environ["GH_REPOSITORY"]
          token = os.environ["GH_TOKEN"]

          def request_json(path: str) -> object:
              request = Request(
                  f"{api_url}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  body = response.read()
              return json.loads(body) if body else {}

          def delete_ref(path: str) -> None:
              request = Request(
                  f"{api_url}{path}",
                  method="DELETE",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  if response.status not in (204, 200):
                      raise RuntimeError(f"Unexpected delete status: {response.status}")

          repo = request_json(f"/repos/{repository}")
          if not isinstance(repo, dict) or repo.get("default_branch") != "main":
              raise SystemExit("Safety stop: repository default branch is not main.")

          open_prs = request_json(f"/repos/{repository}/pulls?state=open&per_page=100")
          if not isinstance(open_prs, list):
              raise SystemExit("Safety stop: could not verify open pull requests.")
          if open_prs:
              numbers = [str(pr.get("number")) for pr in open_prs]
              raise SystemExit(
                  "Safety stop: open pull requests exist; no branch was deleted. PRs: "
                  + ", ".join(numbers)
              )

          branches = []
          for page in range(1, 101):
              batch = request_json(
                  f"/repos/{repository}/branches?per_page=100&page={page}"
              )
              if not isinstance(batch, list):
                  raise SystemExit("Safety stop: branch list response was not a list.")
              branches.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise SystemExit("Safety stop: branch pagination limit exceeded.")

          if not any(branch.get("name") == "main" for branch in branches):
              raise SystemExit("Safety stop: main was not found in the branch list.")

          targets = [
              branch for branch in branches
              if branch.get("name") != "main" and not branch.get("protected", False)
          ]
          protected = [
              branch.get("name") for branch in branches
              if branch.get("name") != "main" and branch.get("protected", False)
          ]

          if protected:
              raise SystemExit(
                  "Safety stop: unexpected protected non-main branches found; "
                  "nothing deleted: " + ", ".join(protected)
              )

          print(f"Verified {len(branches)} branches and no open pull requests.")
          print("Keeping the default branch: main")
          for branch in targets:
              name = branch.get("name")
              if not isinstance(name, str) or not name:
                  raise SystemExit("Safety stop: invalid branch name in API response.")
              ref = quote(f"heads/{name}", safe="/")
              try:
                  delete_ref(f"/repos/{repository}/git/refs/{ref}")
                  print(f"Deleted stale branch: {name}")
              except HTTPError as error:
                  if error.code == 404:
                      print(f"Already absent: {name}")
                      continue
                  raise
              time.sleep(0.1)

          remaining = request_json(f"/repos/{repository}/branches?per_page=100")
          if not isinstance(remaining, list):
              raise SystemExit("Could not verify final branch list.")
          remaining_names = sorted(branch.get("name") for branch in remaining)
          if remaining_names != ["main"]:
              raise SystemExit(f"Cleanup incomplete; remaining branches: {remaining_names}")
          print("Verified: main is the only remaining branch.")

          # Disable this one-time workflow after the cleanup. It is also removed
          # from main immediately after this run is verified.
          workflow_path = quote(".github/workflows/branch-cleanup-once.yml", safe="/")
          disable_request = Request(
              f"{api_url}/repos/{repository}/actions/workflows/{workflow_path}/disable",
              method="PUT",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urlopen(disable_request, timeout=30) as response:
              print(f"Disabled temporary cleanup workflow (HTTP {response.status}).")
          PY
