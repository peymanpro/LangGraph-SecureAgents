name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Validate workflow YAML and release permissions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          import yaml

          workflow_paths = (
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/release.yml"),
              Path(".github/dependabot.yml"),
          )
          documents = {}
          for path in workflow_paths:
              with path.open(encoding="utf-8") as stream:
                  document = yaml.safe_load(stream)
              if not isinstance(document, dict):
                  raise SystemExit(f"{path} must contain a YAML mapping")
              documents[path.as_posix()] = document

          sha_pattern = re.compile(r"^[0-9a-f]{40}$")
          for path in workflow_paths[:2]:
              document = documents[path.as_posix()]
              for job_name, job in document.get("jobs", {}).items():
                  for step in job.get("steps", []):
                      action = step.get("uses")
                      if action is None:
                          continue
                      if "@" not in action or not sha_pattern.fullmatch(action.rsplit("@", 1)[1].split()[0]):
                          raise SystemExit(
                              f"{path}: {job_name} uses an action not pinned to a full commit SHA: {action}"
                          )

          release = documents[".github/workflows/release.yml"]
          release_jobs = release.get("jobs", {})
          if release.get("permissions", {}).get("contents") != "read":
              raise SystemExit("release workflow must default to contents: read")
          if release_jobs.get("build", {}).get("permissions", {}).get("contents") != "read":
              raise SystemExit("release build job must only request contents: read")
          if release_jobs.get("publish", {}).get("permissions", {}).get("contents") != "write":
              raise SystemExit("only the release publish job should request contents: write")
          if release_jobs.get("publish", {}).get("needs") != "build":
              raise SystemExit("release publish job must depend on the validated build job")

          print("Workflow YAML, action SHA pins, and release job permissions validated.")
          PY

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest --cov=langgraph_secure_agents --cov-report=term-missing --cov-fail-under=98

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/langgraph-secure-agents-smoke
          /tmp/langgraph-secure-agents-smoke/bin/python -m pip install --no-deps dist/*.whl

      - name: Smoke-test the installed wheel
        working-directory: /tmp
        run: |
          /tmp/langgraph-secure-agents-smoke/bin/python - <<'PY'
          from langgraph_secure_agents import AccessRequest, Effect, PolicyEngine, PolicyRule, Principal

          policy = PolicyEngine([
              PolicyRule(
                  rule_id="wheel-smoke-test",
                  effect=Effect.ALLOW,
                  actions=frozenset({"read"}),
                  resources=frozenset({"reports"}),
                  roles=frozenset({"analyst"}),
              )
          ])
          decision = policy.evaluate(
              AccessRequest(Principal("smoke-user", frozenset({"analyst"})), "read", "reports")
          )
          assert decision.allowed, decision
          print("Installed wheel smoke test passed.")
          PY

      - name: Smoke-test optional LangChain agent extra
        run: |
          python -m venv /tmp/langgraph-secure-agents-extra
          /tmp/langgraph-secure-agents-extra/bin/python -m pip install ".[langchain-agents]"
          /tmp/langgraph-secure-agents-extra/bin/python - <<'PY'
          from langgraph_secure_agents import PolicyEngine, Principal
          from langgraph_secure_agents.middleware import create_authorization_middleware

          middleware = create_authorization_middleware(
              PolicyEngine(),
              lambda context: Principal("smoke-user"),
          )
          assert callable(middleware.wrap_tool_call)
          print("Optional middleware extra smoke test passed.")
          PY
