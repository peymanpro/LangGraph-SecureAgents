name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Validate workflow YAML, action SHA pins, and release permissions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import yaml

          paths = (
              Path(".github/workflows/ci.yml"),
              Path(".github/workflows/release.yml"),
              Path(".github/dependabot.yml"),
          )
          documents = {}
          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  document = yaml.safe_load(stream)
              if not isinstance(document, dict):
                  raise SystemExit(f"{path} must contain a YAML mapping")
              documents[path.as_posix()] = document

          sha_pattern = re.compile(r"^[0-9a-f]{40}$")
          for path in paths[:2]:
              for job_name, job in documents[path.as_posix()].get("jobs", {}).items():
                  for step in job.get("steps", []):
                      action = step.get("uses")
                      if action and ("@" not in action or not sha_pattern.fullmatch(action.rsplit("@", 1)[1].split()[0])):
                          raise SystemExit(f"{path}: {job_name} action is not pinned to a full SHA: {action}")

          release = documents[".github/workflows/release.yml"]
          jobs = release.get("jobs", {})
          triggers = release.get("on", release.get(True, {}))
          if triggers.get("push", {}).get("branches") != ["main"]:
              raise SystemExit("automatic release workflow must run on pushes to main")
          if jobs.get("release", {}).get("permissions", {}).get("contents") != "write":
              raise SystemExit("versioning job must request contents: write")
          if jobs.get("publish-pypi", {}).get("permissions", {}).get("id-token") != "write":
              raise SystemExit("PyPI publishing job must request id-token: write")
          if "contents" in jobs.get("publish-pypi", {}).get("permissions", {}):
              raise SystemExit("PyPI publishing job must not request repository contents permissions")
          if jobs.get("publish-pypi", {}).get("needs") != "release":
              raise SystemExit("PyPI publishing must depend on the release job")

          dispatch_inputs = triggers.get("workflow_dispatch", {}).get("inputs", {})
          retry_input = dispatch_inputs.get("publish_existing_version", {})
          if retry_input.get("type") != "boolean" or retry_input.get("default") is not False:
              raise SystemExit("manual existing-release recovery must be opt-in")
          if "version" not in dispatch_inputs:
              raise SystemExit("manual recovery must accept an explicit release version")

          retry = jobs.get("retry-existing-pypi", {})
          if retry.get("needs") != ["quality", "package-smoke"]:
              raise SystemExit("PyPI recovery must depend on current quality and package smoke tests")
          retry_condition = str(retry.get("if", ""))
          if "workflow_dispatch" not in retry_condition or "inputs.publish_existing_version" not in retry_condition:
              raise SystemExit("PyPI recovery must be manually triggered and explicitly opted in")
          retry_permissions = retry.get("permissions", {})
          if retry_permissions.get("id-token") != "write" or retry_permissions.get("contents") != "read":
              raise SystemExit("PyPI recovery must use read-only contents plus scoped OIDC permissions")
          if retry.get("environment", {}).get("name") != "pypi":
              raise SystemExit("PyPI recovery must use the configured pypi environment")
          print("Workflow YAML, action SHA pins, release policy, and PyPI recovery permissions validated.")
          PY

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest --cov=langgraph_secure_agents --cov-report=term-missing --cov-fail-under=98

  package-build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Upload validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  package-smoke:
    name: Install and smoke-test distributions
    runs-on: ubuntu-latest
    needs: package-build
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download distributions built by the read-only job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-dist
          path: dist/

      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/langgraph-secure-agents-smoke
          /tmp/langgraph-secure-agents-smoke/bin/python -m pip install --no-deps dist/*.whl

      - name: Smoke-test the installed wheel
        working-directory: /tmp
        run: |
          /tmp/langgraph-secure-agents-smoke/bin/python - <<'PY'
          from importlib.metadata import version as distribution_version

          from langgraph_secure_agents import (
              AccessRequest,
              Effect,
              PolicyEngine,
              PolicyRule,
              Principal,
              __version__,
          )

          policy = PolicyEngine([
              PolicyRule(
                  rule_id="wheel-smoke-test",
                  effect=Effect.ALLOW,
                  actions=frozenset({"read"}),
                  resources=frozenset({"reports"}),
                  roles=frozenset({"analyst"}),
              )
          ])
          decision = policy.evaluate(
              AccessRequest(Principal("smoke-user", frozenset({"analyst"})), "read", "reports")
          )
          assert decision.allowed, decision
          installed_version = distribution_version("langgraph-secure-agents")
          assert __version__ == installed_version, (__version__, installed_version)
          print(f"Installed wheel smoke test passed for version {installed_version}.")
          PY

      - name: Smoke-test optional LangChain agent extra
        run: |
          python -m venv /tmp/langgraph-secure-agents-extra
          /tmp/langgraph-secure-agents-extra/bin/python -m pip install ".[langchain-agents]"
          /tmp/langgraph-secure-agents-extra/bin/python - <<'PY'
          from langgraph_secure_agents import PolicyEngine, Principal
          from langgraph_secure_agents.middleware import create_authorization_middleware

          middleware = create_authorization_middleware(
              PolicyEngine(),
              lambda context: Principal("smoke-user"),
          )
          assert callable(middleware.wrap_tool_call)
          print("Optional middleware extra smoke test passed.")
          PY

      - name: Smoke-test optional LangGraph node guard
        run: |
          python -m venv /tmp/langgraph-secure-agents-langgraph
          /tmp/langgraph-secure-agents-langgraph/bin/python -m pip install ".[langgraph]"
          /tmp/langgraph-secure-agents-langgraph/bin/python - <<'PY'
          from typing import TypedDict

          from langgraph.graph import END, START, StateGraph
          from langgraph.runtime import Runtime

          from langgraph_secure_agents import AuthorizationDenied, Effect, PolicyEngine, PolicyRule, Principal
          from langgraph_secure_agents.langgraph import protect_node

          class State(TypedDict):
              completed: bool

          class Context(TypedDict):
              user_id: str
              roles: list[str]

          policy = PolicyEngine([
              PolicyRule(
                  rule_id="smoke-refund",
                  effect=Effect.ALLOW,
                  actions=frozenset({"refund"}),
                  resources=frozenset({"order:42"}),
                  roles=frozenset({"operator"}),
              )
          ])
          executions: list[str] = []

          def refund(state: State, runtime: Runtime[Context]) -> dict[str, bool]:
              executions.append(runtime.context["user_id"])
              return {"completed": True}

          def resolve_principal(context: object) -> Principal:
              if not isinstance(context, dict):
                  raise TypeError("expected trusted context mapping")
              return Principal(context["user_id"], roles=frozenset(context["roles"]))

          protected = protect_node(
              refund,
              policy=policy,
              principal_resolver=resolve_principal,
              action="refund",
              resource_resolver=lambda _state: "order:42",
          )
          builder = StateGraph(State, context_schema=Context)
          builder.add_node("refund", protected)
          builder.add_edge(START, "refund")
          builder.add_edge("refund", END)
          graph = builder.compile()
          assert graph.invoke(
              {"completed": False},
              context={"user_id": "smoke-user", "roles": ["operator"]},
          )["completed"]
          try:
              graph.invoke(
                  {"completed": False},
                  context={"user_id": "guest", "roles": ["viewer"]},
              )
          except AuthorizationDenied:
              pass
          else:
              raise AssertionError("unauthorized node unexpectedly executed")
          assert executions == ["smoke-user"], executions
          print("Optional LangGraph node authorization smoke test passed.")
          PY
      - name: Smoke-test optional OpenTelemetry audit extra
        run: |
          python -m venv /tmp/langgraph-secure-agents-otel
          /tmp/langgraph-secure-agents-otel/bin/python -m pip install ".[opentelemetry]"
          /tmp/langgraph-secure-agents-otel/bin/python - <<'PY'
          from langgraph_secure_agents import AuditEvent, DecisionReason, create_opentelemetry_callback

          event = AuditEvent(
              principal_id="smoke-user",
              principal_roles=(),
              action="read",
              resource="reports",
              decision_reason=DecisionReason.DEFAULT_DENY,
              allowed=False,
              requires_approval=False,
          )
          callback = create_opentelemetry_callback()
          callback(event)
          print("Optional OpenTelemetry audit extra smoke test passed.")
          PY
      - name: Smoke-test optional MCP tool adapter
        run: |
          python -m venv /tmp/langgraph-secure-agents-mcp
          /tmp/langgraph-secure-agents-mcp/bin/python -m pip install ".[mcp]"
          /tmp/langgraph-secure-agents-mcp/bin/python - <<'PY'
          from mcp.server import MCPServer
          from mcp.server.mcpserver import Context

          from langgraph_secure_agents import Effect, PolicyEngine, PolicyRule, Principal
          from langgraph_secure_agents.mcp_adapter import protect_mcp_tool

          server = MCPServer("mcp-extra-smoke")
          policy = PolicyEngine([
              PolicyRule(
                  rule_id="mcp-extra-smoke",
                  effect=Effect.ALLOW,
                  actions=frozenset({"read"}),
                  resources=frozenset({"read_probe"}),
                  roles=frozenset({"smoke"}),
              )
          ])

          @server.tool()
          @protect_mcp_tool(
              policy=policy,
              principal_resolver=lambda _ctx: Principal(
                  "smoke-user", roles=frozenset({"smoke"})
              ),
              action="read",
          )
          def read_probe(ctx: Context) -> str:
              """Smoke-test an MCP-registered protected tool."""
              return "ok"

          assert callable(read_probe)
          print("Optional MCP tool adapter smoke test passed.")
          PY
