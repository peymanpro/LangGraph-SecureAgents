name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy src

      - name: Test
        run: pytest

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/langgraph-secure-agents-smoke
          /tmp/langgraph-secure-agents-smoke/bin/python -m pip install --no-deps dist/*.whl

      - name: Smoke-test the installed wheel
        working-directory: /tmp
        run: |
          /tmp/langgraph-secure-agents-smoke/bin/python - <<'PY'
          from langgraph_secure_agents import AccessRequest, Effect, PolicyEngine, PolicyRule, Principal

          policy = PolicyEngine([
              PolicyRule(
                  rule_id="wheel-smoke-test",
                  effect=Effect.ALLOW,
                  actions=frozenset({"read"}),
                  resources=frozenset({"reports"}),
                  roles=frozenset({"analyst"}),
              )
          ])
          decision = policy.evaluate(
              AccessRequest(Principal("smoke-user", frozenset({"analyst"})), "read", "reports")
          )
          assert decision.allowed, decision
          print("Installed wheel smoke test passed.")
          PY
