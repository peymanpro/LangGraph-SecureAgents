[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "langgraph-secure-agents"
version = "0.1.0a0"
description = "Deterministic access control for LangGraph agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["langgraph", "ai-agents", "authorization", "access-control", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.optional-dependencies]
langgraph = ["langgraph>=1.0,<2.0"]
langchain-agents = ["langchain>=1.0,<2.0"]
dev = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_secure_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["langgraph_secure_agents"]
