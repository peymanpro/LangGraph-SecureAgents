[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "langgraph-secure-agents"
version = "0.3.0"
description = "Deterministic access control for LangGraph agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["langgraph", "ai-agents", "authorization", "access-control", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/peymanpro/LangGraph-SecureAgents"
Repository = "https://github.com/peymanpro/LangGraph-SecureAgents"
Issues = "https://github.com/peymanpro/LangGraph-SecureAgents/issues"
Security = "https://github.com/peymanpro/LangGraph-SecureAgents/blob/main/SECURITY.md"

[project.optional-dependencies]
langgraph = ["langgraph>=1.2,<2.0"]
yaml = ["PyYAML>=6.0"]
langchain-agents = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langgraph>=1.2,<2.0",
]
opentelemetry = ["opentelemetry-api>=1.25"]
dev = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.2,<2.0",
  "mypy>=1.13",
  "opentelemetry-api>=1.25",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "PyYAML>=6.0",
  "types-PyYAML>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_secure_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["langgraph_secure_agents"]

[tool.semantic_release]
branch = "main"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version} [skip ci]"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
